<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>fma_cinema</title>
<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }
    #ytwrap, #video, #idle, #placement {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
    }
    #ytwrap { display: none; }
    #ytwrap iframe { width: 100%; height: 100%; border: 0; }
    #video { display: none; object-fit: contain; background: #000; }
    #idle {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2b2b2b;
        font: 700 64px/1 Georgia, 'Times New Roman', serif;
        letter-spacing: .2em;
    }
    #placement {
        display: none;
        box-sizing: border-box;
        border: 14px solid #ffc800;
        background-color: rgba(20, 20, 20, .85);
        background-image:
            linear-gradient(rgba(255, 200, 0, .35) 2px, transparent 2px),
            linear-gradient(90deg, rgba(255, 200, 0, .35) 2px, transparent 2px);
        background-size: 10% 10%;
        background-position: -1px -1px;
    }
    #placement .cross-h, #placement .cross-v {
        position: absolute;
        background: #ffc800;
    }
    #placement .cross-h { left: 45%; right: 45%; top: calc(50% - 3px); height: 6px; }
    #placement .cross-v { top: 42%; bottom: 42%; left: calc(50% - 3px); width: 6px; }
    #placement .label {
        position: absolute;
        left: 0; right: 0; bottom: 8%;
        text-align: center;
        color: #ffc800;
        font: 700 56px/1.2 system-ui, sans-serif;
    }
</style>
</head>
<body>
<div id="idle">CINÉMA</div>
<div id="ytwrap"><div id="yt"></div></div>
<video id="video" playsinline></video>
<div id="placement">
    <div class="cross-h"></div>
    <div class="cross-v"></div>
    <div class="label">Aperçu de l'écran (16:9)</div>
</div>

<script>
(() => {
    const DRIFT = 3; // secondes de décalage tolérées avant recalage

    const params = new URLSearchParams(location.search);
    const idle = document.getElementById('idle');
    const ytwrap = document.getElementById('ytwrap');
    const video = document.getElementById('video');

    if (params.get('mode') === 'placement') {
        idle.style.display = 'none';
        document.getElementById('placement').style.display = 'block';
        return;
    }

    let currentUrl = null;
    let volume = 0;
    let yt = null;
    let ytReady = false;
    let ytApi = null;
    let want = { time: 0, paused: false, at: Date.now() };

    function parseYouTube(url) {
        const m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
        return m ? m[1] : null;
    }

    function loadYTApi() {
        if (ytApi) return ytApi;
        ytApi = new Promise((resolve) => {
            window.onYouTubeIframeAPIReady = () => resolve();
            const s = document.createElement('script');
            s.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(s);
        });
        return ytApi;
    }

    function wantedTime() {
        if (want.paused) return want.time;
        return want.time + (Date.now() - want.at) / 1000;
    }

    function applyVolume() {
        if (yt && ytReady) {
            try { yt.unMute(); yt.setVolume(Math.round(volume * 100)); } catch (e) {}
        }
        video.volume = volume;
    }

    function clearPlayers() {
        if (yt) {
            try { yt.destroy(); } catch (e) {}
        }
        yt = null;
        ytReady = false;
        ytwrap.innerHTML = '<div id="yt"></div>';
        ytwrap.style.display = 'none';

        video.pause();
        video.removeAttribute('src');
        video.load();
        video.style.display = 'none';
    }

    function isLive() {
        try {
            const d = yt.getVideoData();
            return !!(d && d.isLive);
        } catch (e) {
            return false;
        }
    }

    function syncYT() {
        if (!yt || !ytReady) return;
        const t = wantedTime();
        const state = yt.getPlayerState();
        const duration = yt.getDuration() || 0;
        const live = isLive();

        if (want.paused) {
            if (state !== YT.PlayerState.PAUSED) yt.pauseVideo();
            if (!live && Math.abs(yt.getCurrentTime() - t) > 1) yt.seekTo(t, true);
            return;
        }
        if (!live && duration > 0 && t >= duration - 1) return; // vidéo terminée
        if (!live && Math.abs(yt.getCurrentTime() - t) > DRIFT) yt.seekTo(t, true);
        if (state !== YT.PlayerState.PLAYING && state !== YT.PlayerState.BUFFERING) yt.playVideo();
    }

    function syncVideo() {
        if (!video.getAttribute('src') || video.readyState < 1) return;
        const t = wantedTime();
        const duration = isFinite(video.duration) ? video.duration : 0;

        if (want.paused) {
            if (!video.paused) video.pause();
            if (duration > 0 && Math.abs(video.currentTime - t) > 1) video.currentTime = Math.min(t, duration);
            return;
        }
        if (duration > 0 && t >= duration - 1) return;
        if (duration > 0 && Math.abs(video.currentTime - t) > DRIFT) video.currentTime = t;
        if (video.paused) video.play().catch(() => {});
    }

    function sync() {
        syncYT();
        syncVideo();
    }

    async function load(url) {
        clearPlayers();
        currentUrl = url;
        idle.style.display = url ? 'none' : 'flex';
        if (!url) return;

        const id = parseYouTube(url);
        if (id) {
            await loadYTApi();
            if (currentUrl !== url) return;
            ytwrap.style.display = 'block';
            yt = new YT.Player('yt', {
                width: '100%',
                height: '100%',
                videoId: id,
                playerVars: {
                    autoplay: 1,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    iv_load_policy: 3,
                    playsinline: 1,
                    rel: 0,
                    start: Math.floor(wantedTime()),
                    origin: location.origin,
                    widget_referrer: location.href,
                },
                events: {
                    onReady: () => {
                        ytReady = true;
                        applyVolume();
                        sync();
                    },
                },
            });
        } else {
            video.style.display = 'block';
            video.src = url;
            video.volume = volume;
            video.onloadedmetadata = () => sync();
        }
    }

    window.addEventListener('message', (ev) => {
        let d = ev.data;
        if (typeof d === 'string') {
            try { d = JSON.parse(d); } catch (e) { return; }
        }
        if (!d || typeof d.type !== 'string') return;

        if (d.type === 'state') {
            const url = d.url || null;
            want = { time: Number(d.time) || 0, paused: !!d.paused, at: Date.now() };
            if (url !== currentUrl) {
                load(url);
            } else {
                sync();
            }
        } else if (d.type === 'volume') {
            volume = Math.max(0, Math.min(1, Number(d.value) || 0));
            applyVolume();
        }
    });
})();
</script>
</body>
</html>
